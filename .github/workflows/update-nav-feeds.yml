name: Update fund NAV feeds

on:
  workflow_dispatch:
  schedule:
    # Pakistan is UTC+5 year-round: 7:30 PM and 9:30 PM PKT, Monday-Friday.
    - cron: "30 14 * * 1-5"
    - cron: "30 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-fund-nav-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nav-updater.txt

      - name: Install updater dependencies
        run: python -m pip install --requirement requirements-nav-updater.txt

      - name: Retrieve and validate official NAVs
        run: python scripts/update_nav_feeds.py

      - name: Publish verified changes
        run: |
          if git diff --quiet -- data/mufap_data.json data/nav_archive.json; then
            echo "The published NAVs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mufap_data.json data/nav_archive.json
          git commit -m "data: update verified fund NAVs"
          git push
